host: localhost:8080
info:
  contact: {}
  description: JWT Auth Server
  title: Auth Server API
  version: "1.0"
paths:
  /adjustments:
    delete:
      consumes:
      - application/json
      description: Delete one or multiple inventory adjustments by their IDs
      parameters:
      - description: Array of Adjustment IDs to delete
        in: body
        name: request
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Delete inventory adjustments
      tags:
      - adjustments
    get:
      consumes:
      - application/json
      description: Get a list of all inventory adjustments with optional filtering
        and pagination
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.InventoryAdjustmentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Get all inventory adjustments
      tags:
      - adjustments
    post:
      consumes:
      - application/json
      description: Add a new inventory adjustment to the system
      parameters:
      - description: Adjustment Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.InventoryAdjustmentCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.InventoryAdjustmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a new inventory adjustment
      tags:
      - adjustments
    put:
      consumes:
      - application/json
      description: Modify details of an existing inventory adjustment
      parameters:
      - description: Adjustment Update Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.InventoryAdjustmentUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Update an existing inventory adjustment
      tags:
      - adjustments
  /adjustments/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific inventory adjustment by its ID
      parameters:
      - description: Adjustment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.InventoryAdjustmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Get an adjustment by ID
      tags:
      - adjustments
  /adjustments/approval:
    post:
      consumes:
      - application/json
      description: Approve a specific inventory adjustment
      parameters:
      - description: Approval Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.InventoryAdjustmentUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Approve an inventory adjustment
      tags:
      - adjustments
  /audit-details:
    delete:
      consumes:
      - application/json
      description: Delete one or multiple inventory audit details by their IDs
      parameters:
      - description: Array of Audit Detail IDs to delete
        in: body
        name: request
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Error'
      security:
      - ApiKeyAuth: []
      summary: Delete audit details
      tags:
      - audit-details
    get:
      consumes:
